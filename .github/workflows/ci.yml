name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      force_all:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for GCP Workload Identity Federation

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.components.outputs.result }}
      is-release: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-banking-mcp: ['mcp-servers/core-banking-mcp/**', 'fixtures/**']
            watchlist-mcp: ['mcp-servers/watchlist-mcp/**', 'fixtures/**']
            device-risk-mcp: ['mcp-servers/device-risk-mcp/**', 'fixtures/**']
            typology-mcp: ['mcp-servers/typology-mcp/**', 'fixtures/**']
      - id: release
        run: echo "result=${{ startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"
      - id: components
        env:
          ALL: '["core-banking-mcp","watchlist-mcp","device-risk-mcp","typology-mcp"]'
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' || steps.release.outputs.result == 'true' }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$FORCE_ALL" = "true" ]; then
            echo "result=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "result=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: 'go.work' }
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: >-
            ./fixtures/... ./mcp-servers/core-banking-mcp/... ./mcp-servers/watchlist-mcp/... ./mcp-servers/device-risk-mcp/... ./mcp-servers/typology-mcp/...
      - run: go build ./fixtures/... ./mcp-servers/core-banking-mcp/... ./mcp-servers/watchlist-mcp/... ./mcp-servers/device-risk-mcp/... ./mcp-servers/typology-mcp/...
      - run: go test ./fixtures/... ./mcp-servers/core-banking-mcp/... ./mcp-servers/watchlist-mcp/... ./mcp-servers/device-risk-mcp/... ./mcp-servers/typology-mcp/... -v

  build-push:
    needs: [changes, lint-test-go]
    if: needs.changes.outputs.components != '[]' && needs.changes.outputs.components != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Compute tag
        id: tag
        run: |
          if [ "${{ needs.changes.outputs.is-release }}" = "true" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        run: |
          IMAGE="${REGISTRY}/${REPO_PATH}/${{ matrix.component }}:${{ steps.tag.outputs.tag }}"
          docker build -f mcp-servers/${{ matrix.component }}/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
